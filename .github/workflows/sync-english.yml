name: Sync English Translations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: vars.SYNC_ENGLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
            else
              FILES="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi
            # Trigger on Chinese sources or Glossary updates
            if echo "$FILES" | grep -qE '(^|/)(mihomo\.yaml|script_override\.js|README\.md|\.github/translation_glossary\.json)$'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Sync English translations
        if: steps.changes.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          SYNC_REQUEST_TIMEOUT: ${{ vars.SYNC_REQUEST_TIMEOUT || '60' }}
          SYNC_MAX_ATTEMPTS: ${{ vars.SYNC_MAX_ATTEMPTS || '3' }}
          SYNC_FILE_TIMEOUT: ${{ vars.SYNC_FILE_TIMEOUT || '300' }}
        run: python .github/scripts/sync_english.py
      - name: Commit generated English files
        if: steps.changes.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync English translations from Chinese"
          file_pattern: "mihomo_en.yaml script_override_en.js README_en.md"
