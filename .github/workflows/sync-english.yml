name: Sync English Translations

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
      - README.md
      - .github/translation_glossary.json
      - .github/scripts/sync_english.py
      - .github/scripts/check_code_sync.py
      - .github/scripts/translation_boundaries.py
      - .github/scripts/js_comment_spans.cjs
      - .github/scripts/tests/**
  workflow_run:
    workflows: ["Template Generate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-english-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    # - Bot commits (e.g. from Template Generate) must not retrigger the
    #   push path; they are handled via workflow_run instead.
    # - workflow_run only proceeds when Template Generate succeeded.
    if: >-
      vars.SYNC_ENGLISH_ENABLED != 'false' &&
      (github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Every entry point publishes to main, and the publish step needs a
          # real branch: checking out github.sha leaves a detached HEAD that
          # silently generated the English files and then failed to push them.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install JavaScript parser
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/translation-parser" acorn@8.15.0
          echo "NODE_PATH=$RUNNER_TEMP/translation-parser/node_modules" >> "$GITHUB_ENV"
      - name: Install YAML dependencies
        run: pip install pyyaml ruamel.yaml
      - name: Test translation boundaries
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # Triggered by Template Generate: script_override.js always needs
            # translation; mihomo.yaml too if either the triggering commit or
            # the generate run changed it. The comparison must include the
            # triggering commit itself -- diffing head_sha..HEAD hides the
            # source files that commit changed, which is exactly how the YAML
            # half of a combined JS+YAML update was skipped.
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            if git rev-parse --verify --quiet "${HEAD_SHA}^" >/dev/null; then
              CHANGED="$(git diff --name-only "${HEAD_SHA}^" HEAD)"
            else
              CHANGED="$(git show --pretty=format: --name-only "$HEAD_SHA")"
            fi
            TARGETS="script_override.js"
            if echo "$CHANGED" | grep -qE '(^|/)mihomo\.yaml$'; then
              TARGETS="script_override.js,mihomo.yaml"
            elif ! python .github/scripts/check_code_sync.py yaml mihomo.yaml mihomo_en.yaml >/dev/null 2>&1; then
              # The generate run was a no-op but the English YAML is still out
              # of sync, so translate it instead of skipping the pair again.
              TARGETS="script_override.js,mihomo.yaml"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
            else
              FILES="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi
            # Trigger on Chinese sources or Glossary updates
            if echo "$FILES" | grep -qE '(^|/)(mihomo\.yaml|script_override\.js|README\.md|\.github/translation_glossary\.json|\.github/scripts/(sync_english\.py|check_code_sync\.py|translation_boundaries\.py|js_comment_spans\.cjs|tests/.*))$'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            TARGETS="$(printf '%s\n' "$FILES" | grep -E '(^|/)(mihomo\.yaml|script_override\.js|README\.md)$' | sed 's#^.*/##' | sort -u | tr '\n' ',')"
            # A boundary/glossary update applies to every translation pair,
            # including when the same push also changes one source file.
            if echo "$FILES" | grep -qE '^\.github/(translation_glossary\.json|scripts/(sync_english\.py|check_code_sync\.py|translation_boundaries\.py|js_comment_spans\.cjs|tests/.*))$'; then
              TARGETS=""
            fi
            echo "targets=${TARGETS%,}" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync English translations
        if: steps.changes.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SYNC_REQUEST_TIMEOUT: ${{ vars.SYNC_REQUEST_TIMEOUT || '60' }}
          SYNC_MAX_ATTEMPTS: ${{ vars.SYNC_MAX_ATTEMPTS || '5' }}
          SYNC_FILE_TIMEOUT: ${{ vars.SYNC_FILE_TIMEOUT || '1800' }}
          SYNC_TARGETS: ${{ steps.changes.outputs.targets }}
          SYNC_USE_GOOGLE_FALLBACK: ${{ vars.SYNC_USE_GOOGLE_FALLBACK || '1' }}
          SYNC_REPORT_PATH: ${{ runner.temp }}/en-sync-report.json
        run: python .github/scripts/sync_english.py
      - name: Validate generated English files
        if: steps.changes.outputs.run == 'true'
        env:
          TARGETS: ${{ steps.changes.outputs.targets }}
        run: |
          set -e
          if [ -z "$TARGETS" ] || echo ",$TARGETS," | grep -q ',mihomo.yaml,'; then
            python .github/scripts/check_code_sync.py yaml mihomo.yaml mihomo_en.yaml
          fi
          if [ -z "$TARGETS" ] || echo ",$TARGETS," | grep -q ',script_override.js,'; then
            python .github/scripts/check_code_sync.py js script_override.js script_override_en.js
          fi
      - name: Commit and push generated English files
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the generated English outputs are ever staged, so a dirty
          # source tree can never be published by this step.
          git add -- mihomo_en.yaml script_override_en.js README_en.md
          if git diff --cached --quiet; then
            echo "No generated English changes to publish."
            exit 0
          fi
          git commit -m "chore: sync English translations from Chinese"
          # The generated English files only match the Chinese source they were
          # produced from. If that source moves while this run retries, the
          # push is refused instead of publishing a mismatched pair; the newer
          # run republishes from the newer source.
          SOURCE_HASH="$(git hash-object -- mihomo.yaml script_override.js README.md)"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated English files conflict with origin/main; not published."
              exit 1
            fi
            if [ "$(git hash-object -- mihomo.yaml script_override.js README.md)" != "$SOURCE_HASH" ]; then
              echo "::error::Chinese sources changed during the run; refusing to publish stale English files."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published generated English files on attempt ${attempt}."
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} failed; refetching origin/main and retrying."
            sleep 5
          done
          echo "::error::Failed to publish generated English files after 5 attempts."
          exit 1
      - name: Upload English sync report
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: en-sync-report
          path: ${{ runner.temp }}/en-sync-report.json
          if-no-files-found: warn
