name: Sync English Translations

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
      - README.md
      - .github/translation_glossary.json
  workflow_run:
    workflows: ["Template Generate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-english-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    # - Bot commits (e.g. from Template Generate) must not retrigger the
    #   push path; they are handled via workflow_run instead.
    # - workflow_run only proceeds when Template Generate succeeded.
    if: >-
      vars.SYNC_ENGLISH_ENABLED != 'false' &&
      (github.event_name != 'push' || github.event.head_commit.author.name != 'github-actions[bot]') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Detect relevant changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            # Triggered by Template Generate: script_override.js always needs
            # translation; mihomo.yaml too if the generate run changed it.
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            CHANGED="$(git diff --name-only "$HEAD_SHA" HEAD)"
            TARGETS="script_override.js"
            if echo "$CHANGED" | grep -qE '(^|/)mihomo\.yaml$'; then
              TARGETS="script_override.js,mihomo.yaml"
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
            else
              FILES="$(git diff-tree --no-commit-id --name-only -r HEAD)"
            fi
            # Trigger on Chinese sources or Glossary updates
            if echo "$FILES" | grep -qE '(^|/)(mihomo\.yaml|script_override\.js|README\.md|\.github/translation_glossary\.json)$'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
            TARGETS="$(printf '%s\n' "$FILES" | grep -E '(^|/)(mihomo\.yaml|script_override\.js|README\.md)$' | sed 's#^.*/##' | sort -u | tr '\n' ',')"
            echo "targets=${TARGETS%,}" >> "$GITHUB_OUTPUT"
          fi
      - name: Sync English translations
        if: steps.changes.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
          SYNC_REQUEST_TIMEOUT: ${{ vars.SYNC_REQUEST_TIMEOUT || '60' }}
          SYNC_MAX_ATTEMPTS: ${{ vars.SYNC_MAX_ATTEMPTS || '5' }}
          SYNC_FILE_TIMEOUT: ${{ vars.SYNC_FILE_TIMEOUT || '1800' }}
          SYNC_TARGETS: ${{ steps.changes.outputs.targets }}
          SYNC_USE_GOOGLE_FALLBACK: ${{ vars.SYNC_USE_GOOGLE_FALLBACK || '1' }}
          SYNC_REPORT_PATH: ${{ runner.temp }}/en-sync-report.json
        run: python .github/scripts/sync_english.py
      - name: Validate generated English files
        if: steps.changes.outputs.run == 'true'
        env:
          TARGETS: ${{ steps.changes.outputs.targets }}
        run: |
          set -e
          if echo ",$TARGETS," | grep -q ',mihomo.yaml,'; then
            python .github/scripts/check_code_sync.py yaml mihomo.yaml mihomo_en.yaml
          fi
          if echo ",$TARGETS," | grep -q ',script_override.js,'; then
            python .github/scripts/check_code_sync.py js script_override.js script_override_en.js
          fi
      - name: Commit generated English files
        if: steps.changes.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync English translations from Chinese"
          file_pattern: "mihomo_en.yaml script_override_en.js README_en.md"
      - name: Upload English sync report
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: en-sync-report
          path: ${{ runner.temp }}/en-sync-report.json
          if-no-files-found: warn
