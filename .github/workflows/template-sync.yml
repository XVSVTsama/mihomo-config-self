name: Template Sync

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail the workflow when the templates are out of sync
        type: boolean
        default: true
      per_commit:
        description: Check every commit in a push
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check template sync
        env:
          CHECK_ENFORCE: ${{ github.event.inputs.enforce || vars.TEMPLATE_SYNC_ENFORCE || '' }}
          CHECK_PER_COMMIT: ${{ github.event.inputs.per_commit || vars.TEMPLATE_SYNC_PER_COMMIT || '' }}
        run: python .github/scripts/run_check.py --file mihomo.yaml --file script_override.js -- python .github/scripts/check_template_sync.py
      - name: Explain how to fix template drift
        # Only a push tells us which side moved; on PRs the diff already shows it.
        if: failure() && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES="$(git diff-tree --no-commit-id --name-only -r "$AFTER")"
          else
            FILES="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi
          echo "Files changed by this push:"
          printf '%s\n' "$FILES" | sed 's/^/  /'
          YAML_CHANGED=false
          JS_CHANGED=false
          if printf '%s\n' "$FILES" | grep -qE '(^|/)mihomo\.yaml$'; then YAML_CHANGED=true; fi
          if printf '%s\n' "$FILES" | grep -qE '(^|/)script_override\.js$'; then JS_CHANGED=true; fi
          if [ "$YAML_CHANGED" = true ] && [ "$JS_CHANGED" = false ]; then
            echo "::error title=Change script_override.js instead of mihomo.yaml::This push edited mihomo.yaml without script_override.js, yet the TEMPLATE inside script_override.js is the source of truth and mihomo.yaml is generated from it. Move the change into TEMPLATE, then let the Template Generate workflow rewrite mihomo.yaml, or run 'python .github/scripts/sync_template_yaml.py' locally and push the result."
          fi
