name: Mihomo Real Core Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "mihomo version: stable, alpha, or exact tag (e.g. v1.19.29)"
        required: false
        default: ""
      config:
        description: "config file to test"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mihomo-test:
    if: >-
      vars.MIHOMO_CHECK_ENABLED != 'false' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && vars.MIHOMO_CHECK_ON_PUSH != 'false') ||
        (github.event_name == 'pull_request' && vars.MIHOMO_CHECK_ON_PR != 'false')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate config path
        env:
          CONFIG: ${{ inputs.config || vars.MIHOMO_CHECK_CONFIG || 'mihomo.yaml' }}
        run: |
          case "$CONFIG" in
            *.yaml|*.yml) ;;
            *)
              echo "::error::Config path must be a YAML file (.yaml or .yml): $CONFIG"
              exit 1
              ;;
          esac
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file not found: $CONFIG"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Resolve mihomo version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          VAR_VERSION: ${{ vars.MIHOMO_CHECK_VERSION || '' }}
        run: |
          VERSION="${INPUT_VERSION:-${VAR_VERSION:-stable}}"
          case "$VERSION" in
            stable|alpha) ;;
            [0-9]*) VERSION="v${VERSION}" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download mihomo binary
        env:
          MIHOMO_TAG: ${{ steps.version.outputs.version }}
        run: |
          TAG="$MIHOMO_TAG"
          case "$TAG" in
            stable)
              TAG="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r .tag_name)"
              ;;
            alpha)
              TAG="$(curl -fsSL "https://api.github.com/repos/MetaCubeX/mihomo/releases?per_page=20" | jq -r '[.[] | select(.prerelease == true)][0].tag_name')"
              ;;
          esac
          ASSET="$(curl -fsSL "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${TAG}" | jq -r '[.assets[].name | select(test("^mihomo-linux-amd64-.*\\.gz$") and (test("-v[0-9]+-") | not) and (test("-compatible-") | not))][0]')"
          if [ -z "$ASSET" ]; then
            echo "::error::No compatible mihomo-linux-amd64 asset found for tag ${TAG}"
            exit 1
          fi
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG}/${ASSET}"
          curl -fsSL "$URL" -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo
      - name: Inject fake nodes
        id: patch
        env:
          CONFIG: ${{ inputs.config || vars.MIHOMO_CHECK_CONFIG || 'mihomo.yaml' }}
        run: |
          PATCHED="$(mktemp --suffix=.yaml)"
          python - "$CONFIG" "$PATCHED" <<'PY'
          import sys
          import yaml

          src, dst = sys.argv[1], sys.argv[2]
          with open(src, encoding="utf-8") as fh:
              data = yaml.safe_load(fh)

          proxies = data.get("proxies") or []
          if not proxies:
              data["proxies"] = [
                  {
                      "name": "fake-node-1",
                      "type": "ss",
                      "server": "127.0.0.1",
                      "port": 8388,
                      "cipher": "aes-128-gcm",
                      "password": "test",
                  },
                  {
                      "name": "fake-node-2",
                      "type": "ss",
                      "server": "127.0.0.1",
                      "port": 8389,
                      "cipher": "aes-128-gcm",
                      "password": "test",
                  },
              ]

          fake_names = [proxy["name"] for proxy in data["proxies"]]
          for group in data.get("proxy-groups") or []:
              if not group.get("proxies") and not group.get("use"):
                  group["proxies"] = fake_names

          with open(dst, "w", encoding="utf-8") as fh:
              yaml.safe_dump(data, fh, allow_unicode=True, default_flow_style=False)
          PY
          echo "patched=$PATCHED" >> "$GITHUB_OUTPUT"
      - name: Test config with mihomo
        env:
          PATCHED: ${{ steps.patch.outputs.patched }}
        run: ./mihomo -t -d . -f "$PATCHED"
