name: Template Cleanup

on:
  create:
  push:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository != 'XVSVTsama/mihomo-config-self' && github.run_number == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve original README
        run: |
          cp README.md README_full.md
          cp README_en.md README_full_en.md
      - name: Generate simplified Chinese README
        run: |
          cat > README.md <<'EOF'
          <p align="center">
            <img src="assets/avatar.png" alt="XVSVTsama" width="120" />
          </p>

          # Mihomo (Clash Meta) 配置模板

          本仓库由 GitHub 模板仓库生成，保留双语配置与完整说明。

          - `README.md`（简化中文） · `README_en.md`（简化英文）
          - `README_full.md`（完整中文） · `README_full_en.md`（完整英文）
          - `mihomo.yaml` · `mihomo_en.yaml`
          - `script_override.js` · `script_override_en.js`
          - `assets/avatar.png`

          源仓库：https://github.com/XVSVTsama/mihomo-config-self

          源作者：https://github.com/XVSVTsama

          [English](README_en.md) · [查看完整说明](README_full.md) · [Read Full Docs](README_full_en.md)
          EOF
      - name: Generate simplified English README
        run: |
          cat > README_en.md <<'EOF'
          <p align="center">
            <img src="assets/avatar.png" alt="XVSVTsama" width="120" />
          </p>

          # Mihomo (Clash Meta) Configuration Template

          This repository is generated from the GitHub template and keeps bilingual configuration files plus full documentation.

          - `README.md` (Simplified Chinese) · `README_en.md` (Simplified English)
          - `README_full.md` (Full Chinese) · `README_full_en.md` (Full English)
          - `mihomo.yaml` · `mihomo_en.yaml`
          - `script_override.js` · `script_override_en.js`
          - `assets/avatar.png`

          Source repository: https://github.com/XVSVTsama/mihomo-config-self

          Source author: https://github.com/XVSVTsama

          [中文](README.md) · [查看完整说明](README_full.md) · [Read Full Docs](README_full_en.md)
          EOF
      - name: Remove template-only files
        run: |
          rm -rf .github .yamllint .editorconfig .gitignore LICENSE
      - name: Commit cleanup
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Template cleanup: keep config files and README"
