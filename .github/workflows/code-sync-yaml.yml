name: Code Sync Check (YAML)

on:
  # 由「Sync English Translations」完成后触发：翻译成功 -> 立即校验中英 YAML 是否一致
  workflow_run:
    workflows: ["Sync English Translations"]
    types: [completed]
  pull_request:
    paths:
      - mihomo.yaml
      - mihomo_en.yaml
  workflow_dispatch:
    inputs:
      enforce:
        description: Fail the workflow when code mismatch is found
        type: boolean
        default: true
      per_commit:
        description: Check every commit in a push
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-yaml:
    runs-on: ubuntu-latest
    # workflow_run 事件：只在「翻译成功」时才执行；PR / 手动触发不受此限制
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check YAML code sync
        env:
          CHECK_ENFORCE: ${{ github.event.inputs.enforce || vars.CODE_SYNC_CHECK_ENFORCE || '' }}
          CHECK_PER_COMMIT: ${{ github.event.inputs.per_commit || vars.CODE_SYNC_CHECK_PER_COMMIT || '' }}
        run: python .github/scripts/run_check.py --file mihomo.yaml --file mihomo_en.yaml -- python .github/scripts/check_code_sync.py yaml mihomo.yaml mihomo_en.yaml
