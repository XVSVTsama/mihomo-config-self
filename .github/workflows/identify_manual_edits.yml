name: Identify Manual Edits

on:
  push:
    paths:
      - 'mihomo_en.yaml'
      - 'script_override_en.js'
      - 'README_en.md'
    branches:
      - main

jobs:
  identify:
    runs-on: ubuntu-latest
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Manual Edits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
        run: python .github/scripts/extract_manual_edits.py

      - name: Commit Glossary Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update translation glossary from manual edits"
          file_pattern: .github/translation_glossary.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
