name: Template Generate

# Syncs mihomo.yaml from the TEMPLATE embedded in script_override.js.
# The JS file is authoritative (see README). This workflow:
#   1. Runs the existing template-sync check first.
#   2. Only when the check fails, patches mihomo.yaml
#      (.github/scripts/sync_template_yaml.py -- text-level patch that
#      preserves comments, formatting and YAML anchors).
#   3. Re-runs the check; commits only on zero differences.
# On success, "Sync English Translations" picks the change up via
# workflow_run and translates the affected files.

on:
  push:
    branches: [main]
    paths:
      - script_override.js
  workflow_dispatch:

concurrency:
  group: template-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install pyyaml ruamel.yaml
      - name: Sync mihomo.yaml from script_override.js
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3: syncing from ${TRIGGER_SHA:0:7}"
            git fetch origin main
            # Discard the previous attempt's working-tree state (if any).
            git reset --hard -q
            # Work from the latest main. The generated YAML is a pure function
            # of the TEMPLATE in script_override.js, so regenerating from the
            # freshest copy of that file is what keeps the pair consistent:
            # restoring this run's original commit here could write YAML that
            # matches an outdated template while newer JS is already on main.
            git checkout -B sync-work origin/main
            if python .github/scripts/check_template_sync.py; then
              echo "mihomo.yaml already in sync with script_override.js; nothing to do."
              exit 0
            fi
            python .github/scripts/sync_template_yaml.py
            echo "Self-verify with the template-sync check:"
            python .github/scripts/check_template_sync.py
            git add mihomo.yaml
            if git diff --cached --quiet; then
              echo "Nothing to publish; origin/main already carries this YAML."
              exit 0
            fi
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m "chore: sync mihomo.yaml from script_override.js (${TRIGGER_SHA:0:7})"
            if git push origin sync-work:main; then
              echo "Synced mihomo.yaml and pushed to main."
              exit 0
            fi
            echo "::warning::Push failed (attempt $attempt/3); refetching and retrying."
          done
          echo "::error::Failed to push synced mihomo.yaml after 3 attempts."
          exit 1
