  # - https://dns.quad9.net/dns-query           # IBM Quad9 Public DNS # 9.9.9.11          149.112.112.11
  # - https://doh.opendns.com/dns-query         # OpenDNS Public DNS # 208.67.220.220      208.67.222.222
  # - https://doh.dns.sb/dns-query              # DNS.SB Public DNS  # 185.222.222.222     45.11.45.11
  # - https://dns.twnic.tw/dns-query            # Quad101 Public DNS # 101.101.101.10      101.102.103.10
  prefer-h3: false
  respect-rules: false                                            
  enhanced-mode: fake-ip                  
  fake-ip-range: '198.18.0.1/16'
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist                    
  fake-ip-filter: 
    - rule-set:fakeip-filter_domain
    - rule-set:private
    - rule-set:direct
    - rule-set:cn
    - rule-set:echs_cn
    - rule-set:echs_direct
    - rule-set:applications
    - rule-set:pixiv
    - pixshaft.com
  nameserver-policy: 
    'rule-set:private,direct,proxy@direct,cn,echs_cn,echs_direct': https://dns.alidns.com/dns-query#DIRECT
