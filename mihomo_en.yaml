# Public template configuration (anchor definitions)
proxies: ~
proxy-groups:
  - name: 🌍 PROXY
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/proxy.png"
    type: select
    proxies:
        - 👉 手动切换
        - ♻️ 自动选择
        - 🔄 负载均衡
        - DIRECT
  - name: 🔄 负载均衡
    icon: "https://www.clashverge.dev/assets/icons/balance.svg"
    type: load-balance
    proxies: # Here are all single nodes (automatically populated by the override script with all subscription nodes)
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    lazy: true
    strategy: sticky-sessions
  - name: 👉 手动切换
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/select.png"
    type: select
    proxies: # Here are all single nodes (automatically populated by the override script with all subscription nodes)
  - name: ♻️ 自动选择
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/auto.png"
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: # Here are all single nodes (automatically populated by the override script with all subscription nodes)
  - name: 📲 Telegram
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/telegram.png"
    type: select
    proxies: # Here are all single nodes (automatically populated by the override script with all subscription nodes)
  - name: 🎮 Games-Global
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/games-cn.png"
    type: select
    proxies: # Here are all single nodes (automatically populated by the override script with all subscription nodes)

  - name: ✖️ Twitter
    icon: "https://www.clashverge.dev/assets/icons/twitter.svg"
    type: select
    filter: "US|Residential"
    include-all-proxies: true
  - name: 🤖 AI大模型
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/ai.png"
    type: select
    filter: "US|Residential"
    include-all-proxies: true
  - name: 🎵 TikTok
    icon: "https://github.com/DustinWin/ruleset_geodata/releases/download/icons/tiktok.png"
    type: select
    filter: "US|Residential"
    include-all-proxies: true
  # FCM: Google FCM domain traffic splitting target (routes to this group after hitting RULE-SET,googlefcm,FCM).
  # This group is not hidden in the template to indicate that this proxy group actually exists and is a real traffic splitting target in the configuration;
  # Hiding it in the override script is for a cleaner UI: the script leverages the Bettbox custom script UI adaptation,
  # using the FCM Direct switch to control this group's proxies: field (on = DIRECT only, off = 👉 Manual Select only),
  # making it convenient for users who need it without directly modifying the configuration file.
  # The switch icon is taken from this group's icon field, and changing the icon only requires modifying it here.
  - name: FCM
    icon: "https://fastly.jsdelivr.net/gh/MiToverG422/Qure@master/IconSet/Color/fcm.png"
    # hidden: true  # Hide this group in the script to keep the interface clean; left visible in the template to indicate that the group indeed exists
    type: select
    proxies:
      - 👉 手动切换
      - DIRECT
